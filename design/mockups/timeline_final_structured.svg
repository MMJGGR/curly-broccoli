<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1120" viewBox="0 0 1440 1120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style><![CDATA[
    .bg { fill: #f8fafc; }
    .muted-surface { fill: #fbfdff; }
    .surface { fill: #ffffff; }
    .border { stroke: #e2e8f0; }
    .muted { fill: #64748b; }
    .fg { fill: #0f172a; }
    .title { font: 700 24px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 14px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, sans-serif; fill: #475569; }
    .sectionTitle { font: 600 13px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, sans-serif; fill: #475569; letter-spacing: 0.3px; }
    .h2 { font: 600 16px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, sans-serif; fill: #0f172a; }
    .label { font: 600 11px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, sans-serif; fill: #475569; letter-spacing: 0.25px; }
    .metric { font: 700 22px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, sans-serif; fill: #0f172a; }
    .small { font: 400 12px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, sans-serif; fill: #475569; }
    .btn { rx: 8; }
    .btnLabel { font: 600 13px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, sans-serif; }
  ]]></style>

  <rect class="bg" x="0" y="0" width="1440" height="1120" />

  <!-- Header -->
  <rect class="surface border" x="80" y="36" width="1280" height="112" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="title" x="112" y="80">Timeline</text>
  <text class="subtitle" x="112" y="106">Milestones, lanes, dependencies, and actions</text>
  <rect class="btn" x="1088" y="66" width="120" height="36" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="btnLabel" x="1114" y="90" fill="#1d4ed8">Add Milestone</text>
  <rect class="btn" x="1220" y="66" width="120" height="36" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="btnLabel" x="1244" y="90" fill="#0f172a">Plan Controls</text>

  <!-- Filters -->
  <rect class="btn" x="800" y="66" width="260" height="36" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect class="btn" x="802" y="68" width="90" height="32" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="btnLabel" x="824" y="90" fill="#1d4ed8">All</text>
  <text class="btnLabel" x="898" y="90" fill="#0f172a">Completed</text>
  <text class="btnLabel" x="996" y="90" fill="#0f172a">Upcoming</text>

  <!-- Overview -->
  <text class="sectionTitle" x="80" y="168">OVERVIEW</text>
  <rect class="muted-surface border" x="80" y="180" width="1280" height="136" rx="12" fill="#fbfdff" stroke="#e6eef9"/>
  <rect class="surface border" x="96" y="196" width="292" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="label" x="116" y="220">PROGRESS</text>
  <text class="metric" x="116" y="248">84%</text>

  <rect class="surface border" x="404" y="196" width="292" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="label" x="424" y="220">MILESTONES DONE</text>
  <text class="metric" x="424" y="248">5/7</text>

  <rect class="surface border" x="712" y="196" width="292" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="label" x="732" y="220">RISK STATUS</text>
  <text class="small" x="732" y="248">On track • Low risk</text>

  <rect class="surface border" x="1020" y="196" width="324" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="label" x="1040" y="220">NEXT MILESTONE</text>
  <text class="small" x="1040" y="248">Home Deposit • 12m</text>

  <!-- Decision Center / Actions -->
  <text class="sectionTitle" x="80" y="336">DECISION CENTER</text>
  <rect class="surface border" x="80" y="350" width="840" height="156" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="h2" x="112" y="382">Next Best Action</text>
  <text class="small" x="112" y="406">Bring forward Education Fund by +KES 3,000/mo (ETA −1 month)</text>
  <rect class="btn" x="112" y="420" width="170" height="36" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="btnLabel" x="134" y="444" fill="#1d4ed8">Adjust Budget</text>

  <rect class="surface border" x="80" y="520" width="840" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="h2" x="112" y="552">Milestones (Lanes)</text>
  <!-- Lane headers -->
  <text class="small" x="112" y="576">Financial Health</text>
  <text class="small" x="112" y="626">Debt</text>
  <text class="small" x="112" y="676">Goals</text>
  <!-- Horizontal bars per lane -->
  <rect x="220" y="564" width="600" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="220" y="564" width="600" height="10" rx="5" fill="#86efac"/>
  <rect x="220" y="614" width="600" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="220" y="614" width="600" height="10" rx="5" fill="#93c5fd"/>
  <rect x="220" y="664" width="600" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="220" y="664" width="410" height="10" rx="5" fill="#93c5fd"/>
  <!-- Dependency markers -->
  <circle cx="430" cy="664" r="6" fill="#60a5fa"/>
  <line x1="430" y1="664" x2="520" y2="614" stroke="#94a3b8" stroke-dasharray="4 4"/>

  <!-- Right: Progress & Evidence -->
  <text class="sectionTitle" x="940" y="336">PROGRESS &amp; EVIDENCE</text>
  <rect class="surface border" x="940" y="350" width="420" height="206" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="h2" x="972" y="382">Timeline Progress</text>
  <rect x="972" y="396" width="360" height="8" rx="4" fill="#e5e7eb"/>
  <rect x="972" y="396" width="302" height="8" rx="4" fill="#93c5fd"/>
  <text class="small" x="972" y="420">5/7 milestones • aligned</text>

  <rect class="surface border" x="940" y="570" width="420" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="h2" x="972" y="602">Event Log (recent)</text>
  <text class="small" x="972" y="624">2025‑10‑02 • Goal updated • Home Deposit +KES 3,000</text>
  <text class="small" x="972" y="644">2025‑10‑01 • Milestone completed • Emergency Fund</text>
  <text class="small" x="972" y="664">2025‑09‑28 • Payment posted • Credit Card</text>

  <!-- Utilities -->
  <text class="sectionTitle" x="80" y="836">UTILITIES</text>
  <rect class="btn" x="80" y="848" width="300" height="30" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="btnLabel" x="96" y="868" fill="#0f172a">Set New Milestone</text>
  <rect class="btn" x="392" y="848" width="300" height="30" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="btnLabel" x="408" y="868" fill="#0f172a">Open Plan</text>

</svg>
