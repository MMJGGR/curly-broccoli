services:
  db:
    image: postgres:15
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    env_file:
      - ./.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - REACT_APP_API_BASE_URL=http://api:8000
    depends_on:
      - api

volumes:
  db_data:
